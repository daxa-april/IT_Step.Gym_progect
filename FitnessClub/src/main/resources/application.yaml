server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml




  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

